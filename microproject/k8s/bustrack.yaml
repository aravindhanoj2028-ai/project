apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bustrack-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bustrack
  labels:
    app: bustrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bustrack
  template:
    metadata:
      labels:
        app: bustrack
    spec:
      containers:
        - name: bustrack
          image: bustrack-admin:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: /app/data
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bustrack-admin-secret
                  key: admin-password
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bustrack-data
---
apiVersion: v1
kind: Service
metadata:
  name: bustrack-service
spec:
  type: NodePort
  selector:
    app: bustrack
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
