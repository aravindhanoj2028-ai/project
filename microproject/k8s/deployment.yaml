apiVersion: apps/v1
kind: Deployment
metadata:
  name: bustrack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bustrack
  template:
    metadata:
      labels:
        app: bustrack
    spec:
      containers:
        - name: bustrack
          image: bustrack:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
